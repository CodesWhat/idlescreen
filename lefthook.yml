commit-msg:
  jobs:
    - name: conventional-commit
      run: ./scripts/validate-commit-msg.sh {1}

pre-commit:
  jobs:
    - name: swift-format
      glob: "*.swift"
      run: xcrun swift-format format --in-place {staged_files}
      stage_fixed: true

# pre-push is the fast gate. The rest of the former list (Qlty, contracts, Xcode
# tests, release fixtures, Release build) lives in scripts/verify.sh, and CI
# runs all of it.
pre-push:
  piped: true
  jobs:
    - name: clean-tree
      run: test -z "$(git status --porcelain)"
    - name: swift-format
      run: ./scripts/check-swift-format.sh changed
    - name: workflow-lint
      glob: ".github/workflows/*.{yml,yaml}"
      run: ./scripts/verify-workflows.sh
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck --severity=error {push_files}
    - name: debug-build
      run: xcodebuild build -quiet -project IdleScreen.xcodeproj -scheme IdleScreenApp -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
