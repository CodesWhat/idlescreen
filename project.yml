name: IdleScreen
options:
  bundleIdPrefix: com.idlescreen
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  developmentLanguage: Swift

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  IDLESCREEN_CAMERA_AGENT_TEAM_IDENTIFIER: 3524374A2S

schemes:
  IdleScreenCtl:
    build:
      targets:
        IdleScreenCtl: all

  IdleScreenAgent:
    build:
      targets:
        IdleScreenAgent: all
        IdleScreenAgentTests: [test]
    test:
      targets:
        - IdleScreenAgentTests

  IdleScreenCore:
    build:
      targets:
        IdleScreenCore: all
        IdleScreenCoreTests: [test]
    test:
      targets:
        - IdleScreenCoreTests

  IdleScreenDisplay:
    build:
      targets:
        IdleScreenDisplay: all
        IdleScreenDisplayTests: [test]
    test:
      targets:
        - IdleScreenDisplayTests

  IdleScreenRenderer:
    build:
      targets:
        IdleScreenRenderer: all
        IdleScreenRendererTests: [test]
    test:
      targets:
        - IdleScreenRendererTests

  IdleScreenPerformance:
    build:
      targets:
        IdleScreenPerformance: all
        IdleScreenPerformanceTests: [test]
    test:
      targets:
        - IdleScreenPerformanceTests

  IdleScreenPerformanceRunner:
    build:
      targets:
        IdleScreenPerformanceRunner: all
    run:
      config: Release
      executable: IdleScreenPerformanceRunner
    profile:
      config: Release
      executable: IdleScreenPerformanceRunner

  IdleScreenCamera:
    build:
      targets:
        IdleScreenCamera: all
        IdleScreenCameraTests: [test]
    test:
      targets:
        - IdleScreenCameraTests

  IdleScreenCameraAgent:
    build:
      targets:
        IdleScreenCameraAgentCore: all
        IdleScreenCameraAgentTests: [test]
    test:
      targets:
        - IdleScreenCameraAgentTests

  IdleScreenSyntheticGate:
    build:
      targets:
        IdleScreenSyntheticGateApp: [archive]

  IdleScreenCameraSyntheticAgentArchive:
    build:
      targets:
        IdleScreenCameraSyntheticAgentArchiveProduct: [archive]
        IdleScreenCameraSyntheticAgent: [archive]
    archive:
      config: Release
    run:
      config: Debug
      executable: IdleScreenCameraSyntheticAgentArchiveProduct
    profile:
      config: Release
      executable: IdleScreenCameraSyntheticAgentArchiveProduct

  IdleScreenSyntheticHostedGateExtensionArchive:
    build:
      targets:
        IdleScreenSyntheticHostedGateExtensionArchiveProduct: [archive]
        IdleScreenSyntheticHostedGateExtension: [archive]
    archive:
      config: Release
    run:
      config: Debug
      executable: IdleScreenSyntheticHostedGateExtensionArchiveProduct
    profile:
      config: Release
      executable: IdleScreenSyntheticHostedGateExtensionArchiveProduct

  # C4 preparation archives only generic bundle products. The helper remains
  # application-shaped and the extension remains appex-shaped, but neither
  # target enters Xcode's application product registration path.
  IdleScreenC4SyntheticHelperArchive:
    build:
      targets:
        IdleScreenC4SyntheticHelperArchiveBundle: [archive]
    archive:
      config: Release
      revealArchiveInOrganizer: false

  IdleScreenC4SyntheticHostedExtensionArchive:
    build:
      targets:
        IdleScreenC4SyntheticHostedExtensionArchiveBundle: [archive]
    archive:
      config: Release
      revealArchiveInOrganizer: false

  IdleScreenSyntheticGateTests:
    build:
      targets:
        IdleScreenCameraSyntheticAgentCore: all
        IdleScreenSyntheticGateTests: [test]
    test:
      targets:
        - IdleScreenSyntheticGateTests

  IdleScreenSystem:
    build:
      targets:
        IdleScreenSystem: all
        IdleScreenSystemTests: [test]
    test:
      targets:
        - IdleScreenSystemTests

  IdleScreenScreenSaver:
    build:
      targets:
        IdleScreenScreenSaverTests: [test]
    test:
      targets:
        - IdleScreenScreenSaverTests

  IdleScreenAppCamera:
    build:
      targets:
        IdleScreenCamera: all
        IdleScreenAppCameraTests: [test]
    test:
      targets:
        - IdleScreenAppCameraTests

  IdleScreenAppCompileGate:
    build:
      targets:
        IdleScreenAppCompileGateTests: [test]
    test:
      targets:
        - IdleScreenAppCompileGateTests

  # Deliberate C3 entry point. The outer app and nested helper use application-
  # shaped bundle targets (`.app` + `mh_execute`) because Xcode 26 registers
  # every `type: application` product unconditionally, including Archive-only
  # products. These C3-only targets preserve the shipping bytes/contracts while
  # avoiding ApplicationProductTypeSpec's LaunchServices task entirely.
  IdleScreenC3ReleaseArchive:
    build:
      targets:
        IdleScreenC3ArchiveBundle: [archive]
    archive:
      config: Release
      revealArchiveInOrganizer: false

targets:
  IdleScreenAgent:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenAgent
    settings:
      base:
        PRODUCT_NAME: IdleScreenAgent
        PRODUCT_MODULE_NAME: IdleScreenAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.agent
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - target: IdleScreenCore
      - sdk: CryptoKit.framework

  IdleScreenAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenAgentTests
    settings:
      base:
        PRODUCT_NAME: IdleScreenAgentTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.agent-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenAgent
      - target: IdleScreenCore

  IdleScreenCtl:
    type: tool
    platform: macOS
    sources:
      - path: Products/IdleScreenAgentExecutable
    settings:
      base:
        PRODUCT_NAME: idlescreenctl
        PRODUCT_MODULE_NAME: IdleScreenCtl
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.ctl
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Products/IdleScreenAgentExecutable/idlescreenctl.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Products/IdleScreenAgentExecutable/idlescreenctl-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Products/IdleScreenAgentExecutable/idlescreenctl.entitlements
          OTHER_CODE_SIGN_FLAGS: "--identifier com.idlescreen.ctl"
          DEVELOPMENT_TEAM: 3524374A2S
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          REGISTER_APP_GROUPS: YES
    dependencies:
      - target: IdleScreenAgent
        embed: false
      - target: IdleScreenCore
        embed: false

  IdleScreenCore:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenCore
    settings:
      base:
        PRODUCT_NAME: IdleScreenCore
        PRODUCT_MODULE_NAME: IdleScreenCore
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.core
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  IdleScreenCoreStoreTestWorker:
    type: tool
    platform: macOS
    sources:
      - path: Tests/IdleScreenCoreTestSupport
    settings:
      base:
        PRODUCT_NAME: idlescreen-store-test-worker
        PRODUCT_MODULE_NAME: IdleScreenCoreStoreTestWorker
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.core-store-test-worker
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
    dependencies:
      - target: IdleScreenCore

  IdleScreenRenderer:
    type: framework
    platform: macOS
    sources:
      - path: Sources/IdleScreenRenderer
    settings:
      base:
        PRODUCT_NAME: IdleScreenRenderer
        PRODUCT_MODULE_NAME: IdleScreenRenderer
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.renderer
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  IdleScreenCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenCoreTests
    settings:
      base:
        PRODUCT_NAME: IdleScreenCoreTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.core-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenCore
      - target: IdleScreenCoreStoreTestWorker
        link: false

  IdleScreenRendererTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenRendererTests
    settings:
      base:
        PRODUCT_NAME: IdleScreenRendererTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.renderer-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenRenderer

  IdleScreenPerformance:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenPerformance
    settings:
      base:
        PRODUCT_NAME: IdleScreenPerformance
        PRODUCT_MODULE_NAME: IdleScreenPerformance
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.performance
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - target: IdleScreenCore
      - target: IdleScreenRenderer
      - target: IdleScreenCamera
      - target: IdleScreenCameraAgentCore
      - sdk: AppKit.framework
      - sdk: MetalKit.framework

  IdleScreenPerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenPerformanceTests
    settings:
      base:
        PRODUCT_NAME: IdleScreenPerformanceTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.performance-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenPerformance

  IdleScreenPerformanceRunner:
    type: tool
    platform: macOS
    sources:
      - path: Support/IdleScreenPerformanceExecutable
    settings:
      base:
        PRODUCT_NAME: idlescreen-perf
        PRODUCT_MODULE_NAME: IdleScreenPerformanceRunner
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.performance-runner
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
    dependencies:
      - target: IdleScreenPerformance
      - target: IdleScreenCore
      - target: IdleScreenRenderer
      - target: IdleScreenCamera
      - target: IdleScreenCameraAgentCore
      - sdk: AppKit.framework
      - sdk: MetalKit.framework

  IdleScreenDisplay:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenDisplay
    settings:
      base:
        PRODUCT_NAME: IdleScreenDisplay
        PRODUCT_MODULE_NAME: IdleScreenDisplay
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.display
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: IdleScreenCore
      - sdk: AppKit.framework
      - sdk: ColorSync.framework
      - sdk: CoreGraphics.framework

  IdleScreenDisplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenDisplayTests
    settings:
      base:
        PRODUCT_NAME: IdleScreenDisplayTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.display-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenCore
      - target: IdleScreenDisplay

  IdleScreenCameraAtomics:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenCameraAtomics
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraAtomics
        PRODUCT_MODULE_NAME: IdleScreenCameraAtomics
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-atomics
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES

  IdleScreenCamera:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenCamera
    settings:
      base:
        PRODUCT_NAME: IdleScreenCamera
        PRODUCT_MODULE_NAME: IdleScreenCamera
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - target: IdleScreenCameraAtomics

  IdleScreenCameraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenCameraTests
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenCamera

  IdleScreenCameraAgent:
    type: application
    platform: macOS
    sources:
      - path: Products/IdleScreenCameraAgentExecutable
    info:
      path: Products/IdleScreenCameraAgentExecutable/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: idlescreen
        CFBundleDisplayName: idlescreen
        CFBundleExecutable: IdleScreenCameraAgent
        CFBundlePackageType: APPL
        CFBundleVersion: "28"
        CFBundleShortVersionString: "0.1"
        LSBackgroundOnly: true
        LSUIElement: true
        NSCameraUsageDescription: "idlescreen uses the camera only for camera-based screen saver effects you explicitly enable."
        NSCameraUseContinuityCameraDeviceType: true
        IdleScreenCameraAgentMachServiceName: $(IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME)
        IdleScreenCameraAgentAppGroupIdentifier: $(IDLESCREEN_APP_GROUP_IDENTIFIER)
        IdleScreenCameraAgentTeamIdentifier: $(IDLESCREEN_CAMERA_AGENT_TEAM_IDENTIFIER)
        IdleScreenCameraAgentMailboxFileName: camera-frames-v1.mailbox
        IdleScreenCameraAgentLaunchAgentSHA256: $(IDLESCREEN_CAMERA_AGENT_LAUNCH_AGENT_SHA256)
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraAgent
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Sources/IdleScreenCameraAgent/IdleScreenCameraAgent.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-agent.dev
          IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME: group.com.idlescreen.dev.shared.camera-agent
          IDLESCREEN_APP_GROUP_IDENTIFIER: group.com.idlescreen.dev.shared
          IDLESCREEN_CAMERA_AGENT_LAUNCH_AGENT_SHA256: 43adaaf96c2c1ea87365b2f46e33327005ecaa1fa4bdf8eb9e2edead682ad9cf
          CODE_SIGN_ENTITLEMENTS: Sources/IdleScreenCameraAgent/IdleScreenCameraAgent-Debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-agent
          IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME: group.com.idlescreen.shared.camera-agent
          IDLESCREEN_APP_GROUP_IDENTIFIER: group.com.idlescreen.shared
          IDLESCREEN_CAMERA_AGENT_LAUNCH_AGENT_SHA256: 151f0b19ff95aa853a3188f7e64c3eae8d159c5718658a4ba6e9518dcaa19e92
          CODE_SIGN_ENTITLEMENTS: Sources/IdleScreenCameraAgent/IdleScreenCameraAgent.entitlements
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 3524374A2S
          CODE_SIGN_IDENTITY: "Apple Development"
          REGISTER_APP_GROUPS: YES
    dependencies:
      - target: IdleScreenCameraAgentCore
        embed: false
      - target: IdleScreenCore
        embed: false
      - target: IdleScreenCamera
        embed: false
      - target: IdleScreenCameraAtomics
        embed: false
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework

  # C3-only application-shaped bundle. Its executable and signed contract are
  # identical to IdleScreenCameraAgent, but the bundle product type prevents
  # Xcode 26 from planning RegisterWithLaunchServices.
  IdleScreenC3CameraAgentArchiveBundle:
    type: bundle
    platform: macOS
    sources:
      - path: Products/IdleScreenCameraAgentExecutable
    info:
      path: Products/IdleScreenCameraAgentExecutable/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: idlescreen
        CFBundleDisplayName: idlescreen
        CFBundleExecutable: IdleScreenCameraAgent
        CFBundlePackageType: APPL
        CFBundleVersion: "28"
        CFBundleShortVersionString: "0.1"
        LSBackgroundOnly: true
        LSUIElement: true
        NSCameraUsageDescription: "idlescreen uses the camera only for camera-based screen saver effects you explicitly enable."
        NSCameraUseContinuityCameraDeviceType: true
        IdleScreenCameraAgentMachServiceName: $(IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME)
        IdleScreenCameraAgentAppGroupIdentifier: $(IDLESCREEN_APP_GROUP_IDENTIFIER)
        IdleScreenCameraAgentTeamIdentifier: $(IDLESCREEN_CAMERA_AGENT_TEAM_IDENTIFIER)
        IdleScreenCameraAgentMailboxFileName: camera-frames-v1.mailbox
        IdleScreenCameraAgentLaunchAgentSHA256: $(IDLESCREEN_CAMERA_AGENT_LAUNCH_AGENT_SHA256)
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraAgent
        PRODUCT_MODULE_NAME: IdleScreenCameraAgentC3Archive
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-agent
        WRAPPER_EXTENSION: app
        MACH_O_TYPE: mh_execute
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: YES
        IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME: group.com.idlescreen.shared.camera-agent
        IDLESCREEN_APP_GROUP_IDENTIFIER: group.com.idlescreen.shared
        IDLESCREEN_CAMERA_AGENT_LAUNCH_AGENT_SHA256: 151f0b19ff95aa853a3188f7e64c3eae8d159c5718658a4ba6e9518dcaa19e92
        CODE_SIGN_ENTITLEMENTS: Sources/IdleScreenCameraAgent/IdleScreenCameraAgentC3Archive.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3524374A2S
        CODE_SIGN_IDENTITY: "Apple Development"
        REGISTER_APP_GROUPS: YES
    postBuildScripts:
      - name: Embed C3 helper provisioning profile
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          test -f "$IDLESCREEN_C3_HELPER_PROVISIONING_PROFILE_PATH"
          /usr/bin/ditto "$IDLESCREEN_C3_HELPER_PROVISIONING_PROFILE_PATH" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/embedded.provisionprofile"
    dependencies:
      - target: IdleScreenCameraAgentCore
        embed: false
      - target: IdleScreenCore
        embed: false
      - target: IdleScreenCamera
        embed: false
      - target: IdleScreenCameraAtomics
        embed: false
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework

  IdleScreenCameraAgentCore:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenCameraAgent/CameraAgentService.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentDiagnostics.swift
      - path: Sources/IdleScreenCameraAgent/CameraCaptureSessionController.swift
      - path: Sources/IdleScreenCameraAgent/CameraFrameMailboxWriter.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentXPCListener.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentRuntimeDriver.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentProcessRuntime.swift
      - path: Sources/IdleScreenCameraAgent/CameraDeviceInventory.swift
      - path: Sources/IdleScreenCameraAgent/AVFoundationCameraCaptureComposition.swift
      - path: Sources/IdleScreenCameraAgent/AVFoundationCameraAgentComposition.swift
      - path: Sources/IdleScreenCameraAgent/AVFoundationCameraDeviceInventory.swift
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraAgentCore
        PRODUCT_MODULE_NAME: IdleScreenCameraAgentCore
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-agent-core
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - target: IdleScreenCore
      - target: IdleScreenCamera
      - target: IdleScreenCameraAtomics
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
      - sdk: AppKit.framework

  IdleScreenCameraAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IdleScreenCameraAgentTests/CameraAgentServiceTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraCaptureSessionControllerTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraFrameMailboxWriterTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraAgentXPCListenerTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraAgentRuntimeDriverTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraAgentProcessRuntimeTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraDeviceInventoryTests.swift
      - path: Tests/IdleScreenCameraAgentTests/CameraAgentDiagnosticsTests.swift
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraAgentTests
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-agent-tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: IdleScreenCore
      - target: IdleScreenCamera
      - target: IdleScreenCameraAgentCore

  IdleScreenCameraSyntheticAgentCore:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/IdleScreenCameraAgent/CameraAgentService.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentDiagnostics.swift
      - path: Sources/IdleScreenCameraAgent/CameraCaptureSessionController.swift
      - path: Sources/IdleScreenCameraAgent/CameraFrameMailboxWriter.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentXPCListener.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentRuntimeDriver.swift
      - path: Sources/IdleScreenCameraAgent/CameraAgentProcessRuntime.swift
      - path: Sources/IdleScreenCameraAgent/CameraDeviceInventory.swift
      - path: Support/IdleScreenSyntheticGate/Core
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraSyntheticAgentCore
        PRODUCT_MODULE_NAME: IdleScreenCameraSyntheticAgentCore
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.camera-synthetic-agent-core
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
    dependencies:
      - target: IdleScreenCore
      - target: IdleScreenCamera
      - target: IdleScreenCameraAtomics
      - sdk: AppKit.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework

  IdleScreenCameraSyntheticAgent:
    type: application
    platform: macOS
    sources:
      - path: Support/IdleScreenSyntheticGate/Executable
    info:
      path: Support/IdleScreenSyntheticGate/HelperInfo.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: idlescreen
        CFBundleDisplayName: idlescreen
        CFBundleExecutable: IdleScreenCameraAgent
        CFBundlePackageType: APPL
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1"
        LSBackgroundOnly: true
        LSUIElement: true
        IdleScreenCameraAgentMachServiceName: $(IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME)
        IdleScreenCameraAgentAppGroupIdentifier: $(IDLESCREEN_APP_GROUP_IDENTIFIER)
        IdleScreenCameraAgentTeamIdentifier: $(IDLESCREEN_CAMERA_AGENT_TEAM_IDENTIFIER)
        IdleScreenCameraAgentMailboxFileName: camera-frames-v1.mailbox
        IdleScreenSyntheticGateVersion: "1"
    settings:
      base:
        PRODUCT_NAME: IdleScreenCameraAgent
        PRODUCT_MODULE_NAME: IdleScreenCameraSyntheticAgent
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        # Gate-only helper archive product; shipping helper remains embedded and
        # SKIP_INSTALL=YES in the production graph.
        SKIP_INSTALL: NO
