        CFBundleVersion: "62"
        IdleScreenAppGroupIdentifier: $(IDLESCREEN_APP_GROUP_IDENTIFIER)
        IdleScreenCameraAgentAppGroupIdentifier: $(IDLESCREEN_APP_GROUP_IDENTIFIER)
        IdleScreenCameraAgentMachServiceName: $(IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME)
        IdleScreenCameraAgentTeamIdentifier: $(IDLESCREEN_CAMERA_AGENT_TEAM_IDENTIFIER)
        IdleScreenSharedContainerEnabled: $(IDLESCREEN_SHARED_CONTAINER_ENABLED)
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: "idlescreen uses the camera only for camera-based screen saver effects you explicitly enable."
    settings:
      base:
        PRODUCT_NAME: IdleScreen
        PRODUCT_MODULE_NAME: IdleScreenApp
        PRODUCT_BUNDLE_IDENTIFIER: com.idlescreen.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WRAPPER_EXTENSION: app
        MACH_O_TYPE: mh_execute
        INSTALL_PATH: /Applications
        SKIP_INSTALL: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IDLESCREEN_APP_GROUP_IDENTIFIER: group.com.idlescreen.shared
        IDLESCREEN_CAMERA_AGENT_MACH_SERVICE_NAME: group.com.idlescreen.shared.camera-agent
        IDLESCREEN_SHARED_CONTAINER_ENABLED: YES
        EXCLUDED_SOURCE_FILE_NAMES: group.com.idlescreen.dev.shared.camera-agent.plist
        CODE_SIGN_ENTITLEMENTS: Products/IdleScreenApp/IdleScreenC3Archive.entitlements
        DEVELOPMENT_TEAM: 3524374A2S
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        REGISTER_APP_GROUPS: YES
    postBuildScripts:
      - name: Embed C3 app provisioning profile
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          test -f "$IDLESCREEN_C3_APP_PROVISIONING_PROFILE_PATH"
          /usr/bin/ditto "$IDLESCREEN_C3_APP_PROVISIONING_PROFILE_PATH" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/embedded.provisionprofile"
    dependencies:
      - target: IdleScreenAgent
        embed: false
      - target: IdleScreenCore
        embed: false
      - target: IdleScreenRenderer
        embed: true
      - target: IdleScreenCamera
        embed: false
      - target: IdleScreenSystem
        embed: false
      - target: IdleScreenScreenSaver
        embed: true
      - target: IdleScreenC3CameraAgentArchiveBundle
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: IdleScreenCtl
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

