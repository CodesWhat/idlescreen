config_version = "0"

exclude_patterns = [
  "**/build/**",
  "**/DerivedData/**",
  "**/*.xcresult/**",
  ".claude/**",
  ".qlty/**",
]

[coverage]
ignores = [
  "**/*Tests/**",
  "Tests/IdleScreenCoreTestSupport/**",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "trufflehog"
