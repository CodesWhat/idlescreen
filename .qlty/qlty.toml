config_version = "0"

exclude_patterns = [
  "**/build/**",
  "**/DerivedData/**",
  "**/*.xcresult/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/vendor/**",
  "**/.next/**",
  "**/.build/**",
  "**/*.min.*",
  ".claude/**",
  ".planning/**",
  ".qlty/**",
]

[coverage]
ignores = [
  "**/*Tests/**",
  "Tests/IdleScreenCoreTestSupport/**",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "zizmor"

[[plugin]]
name = "osv-scanner"
