name: CI Verify

run-name: >-
  ${{
    github.event_name == 'schedule' && 'CI Verify - Weekly schedule' ||
    github.event_name == 'pull_request' && format('CI Verify - PR #{0}', github.event.pull_request.number) ||
    format('CI Verify - {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

# Pull requests supersede their own older runs. Pushes get a group per commit
# and are never cancelled, so a protected-branch push always finishes and
# records its tree receipt.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fail-open changes gate. Only pull requests are evaluated; push, schedule
  # and dispatch runs always report true. Any doubt inside the action also
  # reports true. The job itself always succeeds so a push run stays eligible
  # as tree-receipt evidence (a skipped job rejects the run).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Normalized: only an explicit 'false' skips work.
      native: ${{ steps.native.outputs.run == 'false' && 'false' || 'true' }}
      web: ${{ steps.web.outputs.run == 'false' && 'false' || 'true' }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Gate pull requests on Swift, project and dependency inputs
        id: native
        if: github.event_name == 'pull_request'
        uses: CodesWhat/.github/actions/changes-gate@684a6b931e7802f1985e2cb4f6ea0c95861988e3
        with:
          patterns: |
            **
            !website/**
            !docs-site/**
            !docs/**
            !**/*.md
            !LICENSE
            !.github/ISSUE_TEMPLATE/**

      - name: Gate pull requests on website and docs inputs
        id: web
        if: github.event_name == 'pull_request'
        uses: CodesWhat/.github/actions/changes-gate@684a6b931e7802f1985e2cb4f6ea0c95861988e3
        with:
          patterns: |
            website/**
            docs-site/**
            scripts/verify-website-browsers.sh
            .github/workflows/ci-verify.yml

  # Reads the receipt a push run recorded for an identical tree. Evaluated on
  # pull requests only; push runs never reuse, so main and dev always verify
  # in full. The job runs on every event so push runs have no skipped jobs.
  receipt-check:
    name: receipt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      reuse: ${{ steps.receipt.outputs.reuse }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Look for a verified receipt for this tree
        id: receipt
        if: github.event_name == 'pull_request'
        uses: CodesWhat/.github/actions/tree-receipt/verify@684a6b931e7802f1985e2cb4f6ea0c95861988e3

  build-and-test:
    needs: [changes, receipt-check]
    # Fail open. A bare output check carries an implicit success(), so a failed
    # gate would skip this job and the required check would still pass. Skip
    # only when the gate succeeded and said 'false', or a pull request has a
    # verified receipt for the same tree. A skipped job reports success to the
    # required build-and-test check.
    if: >-
      ${{ !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.native != 'false') &&
      (github.event_name != 'pull_request' ||
      needs.receipt-check.result != 'success' ||
      needs.receipt-check.outputs.reuse != 'true') }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            cdn.playwright.dev:443
            storage.googleapis.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          ./scripts/install-xcodegen.sh 2.46.0 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          export PATH="$RUNNER_TEMP/xcodegen-2.46.0/bin:$PATH"
          [[ "$(xcodegen --version)" == "Version: 2.46.0" ]]

      - name: Generate Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- IdleScreen.xcodeproj
          [[ -z "$(git ls-files --others --exclude-standard -- IdleScreen.xcodeproj)" ]]

      - name: Check changed Swift formatting
        run: ./scripts/check-swift-format.sh changed

      - name: Verify canonical repository and project contracts
        run: |
          ./scripts/test-repository-layout.sh
          ./scripts/test-project-contracts.sh
          ./scripts/test-app-accessibility-labels.sh

      - name: Run modern unit and integration tests
        env:
          IDLESCREEN_ENABLE_COVERAGE: ${{ github.event_name == 'push' && 'YES' || 'NO' }}
        run: ./scripts/test-modern-schemes.sh "$RUNNER_TEMP/idlescreen-test-results"

      - name: Run deterministic product fixtures
        env:
          IDLESCREEN_COVERAGE_RESULT_BUNDLE: ${{ github.event_name == 'push' && format('{0}/idlescreen-test-results/IdleScreenAppCompileGate.xcresult', runner.temp) || '' }}
        run: |
          python3 ./scripts/test_xccov_to_lcov.py
          ./scripts/test-coverage-floor.sh
          python3 ./scripts/test_performance_r1_report.py
          ./scripts/test-run-performance-r1.sh
          ./scripts/test-camera-gate-c8-soak-planner.py
          ./scripts/test-controlled-physical-soak.py
          ./scripts/test-companion-compile-gate.sh /tmp/idlescreen-ci-companion-gate
          ./scripts/test-idlescreenctl-runtime.sh
          ./scripts/test-camera-agent-product-fixtures.sh
          (umask 077; ./scripts/test-synthetic-gate-product-fixtures.sh)
          ./scripts/test-release-archive-provenance-fixtures.sh
          ./scripts/test-r1-release-candidate-fixtures.sh
          ./scripts/test-public-release-contract.sh
          ./scripts/test-camera-gate-c4-evidence-fixtures.py
          ./scripts/test-camera-gate-c5-evidence-fixtures.py
          ./scripts/test-camera-gate-evidence-common.py
          ./scripts/test-camera-gate-c6-offline-fixtures.py
          ./scripts/test-camera-gate-c8-offline-fixtures.py
          ./scripts/test-camera-agent-profile-policy.sh
          ./scripts/test-camera-gate-a1-config.sh
          ./scripts/test-camera-gate-a1-runner.sh
          ./scripts/test-companion-launch-policy.sh
          ./scripts/test-console-lock-state.sh
          ./scripts/test-host-lifecycle-log.sh
          ./scripts/test-host-lifecycle-matrix-evidence.sh
          ./scripts/test-host-lifecycle-matrix-guard.sh
          ./scripts/test-idle-activation-log.sh
          ./scripts/test-install-phase1-release-registration.sh
          ./scripts/test-live-configuration-delivery-guard.sh
          ./scripts/test-physical-state-transition.sh
          ./scripts/test-product-identity-verifier.sh
          ./scripts/test-record-host-lifecycle-matrix-cycle.sh
          ./scripts/test-selection-probe.sh
          ./scripts/test-shared-state-verifier.sh
          ./scripts/test-synthetic-gate-contracts.sh
          ./scripts/test-synthetic-gate-transaction.sh
          ./scripts/test-release-sbom-symlinks.sh
          ./scripts/test-notary-credential-fallback.sh

      - name: Convert test-run coverage to LCOV
        if: github.event_name == 'push'
        run: |
          results_root="$RUNNER_TEMP/idlescreen-test-results"
          coverage_root="$RUNNER_TEMP/idlescreen-coverage"
          mkdir -p "$coverage_root"
          for result_bundle in "$results_root"/*.xcresult; do
            scheme="$(basename "$result_bundle" .xcresult)"
            xcrun xccov view --archive --json "$result_bundle" \
              >"$coverage_root/$scheme.json"
          done
          [[ "$(find "$coverage_root" -name '*.json' | wc -l)" -eq 12 ]]
          python3 ./scripts/xccov_to_lcov.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$coverage_root/coverage.lcov" "$coverage_root"/*.json

      - name: Upload coverage report for the coverage job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: ${{ runner.temp }}/idlescreen-coverage/coverage.lcov
          if-no-files-found: error
          retention-days: 1

      - name: Build canonical companion product
        run: |
          xcodebuild build -quiet \
            -project IdleScreen.xcodeproj \
            -scheme IdleScreenApp \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/idlescreen-ci-product \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  # Website and docs browser checks. Still on macOS: the egress list and the
  # three-browser install are proven there, and moving them to Linux is a
  # separate change. Skipped for Swift-only and Markdown-only pull requests.
  website:
    needs: [changes, receipt-check]
    if: >-
      ${{ !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') &&
      (github.event_name != 'pull_request' ||
      needs.receipt-check.result != 'success' ||
      needs.receipt-check.outputs.reuse != 'true') }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            cdn.playwright.dev:443
            storage.googleapis.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for website and docs checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Website and docs build and browser checks (Chromium, Firefox, WebKit)
        run: ./scripts/verify-website-browsers.sh

  coverage:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage report from build-and-test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: ${{ runner.temp }}/idlescreen-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/idlescreen-coverage/coverage.lcov
          disable_search: true
          plugins: noop
          fail_ci_if_error: true

      - name: Enforce the 80% line-coverage floor
        run: |
          python3 ./scripts/check_coverage_floor.py --floor 80.0 \
            "$RUNNER_TEMP/idlescreen-coverage/coverage.lcov"

  qlty:
    name: qlty
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            api.segment.io:443
            api0.prismacloud.io:443
            cafe.github.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github-proxy.qlty.sh:443
            github.com:443
            go.dev:443
            nodejs.org:443
            proxy.golang.org:443
            pypi.org:443
            qlty-releases.s3.amazonaws.com:443
            radarlint-releases.s3.amazonaws.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Run Qlty gate
        run: ./scripts/qlty-check-gate.sh all

  # Final job on push runs. Records the tree receipt a later pull request
  # looks for, and only when every job ran and passed. Nothing is gated off on
  # push, so any result other than success is a failure. Pull requests never
  # reach this job, so they never get a status-writing credential.
  receipt:
    needs: [changes, receipt-check, build-and-test, website, coverage, qlty]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Fail unless every job ran and passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "a needed job ended as $result"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the tree receipt
        uses: CodesWhat/.github/actions/tree-receipt/record@684a6b931e7802f1985e2cb4f6ea0c95861988e3
