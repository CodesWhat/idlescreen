name: CI Verify

run-name: >-
  ${{
    github.event_name == 'schedule' && 'CI Verify - Weekly schedule' ||
    github.event_name == 'pull_request' && format('CI Verify - PR #{0}', github.event.pull_request.number) ||
    format('CI Verify - {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            cdn.playwright.dev:443
            storage.googleapis.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          [[ "$(xcodegen --version)" == "Version: 2.46.0" ]]

      - name: Generate Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- IdleScreen.xcodeproj
          [[ -z "$(git ls-files --others --exclude-standard -- IdleScreen.xcodeproj)" ]]

      - name: Check changed Swift formatting
        run: ./scripts/check-swift-format.sh changed

      - name: Verify canonical repository and project contracts
        run: |
          ./scripts/test-repository-layout.sh
          ./scripts/test-project-contracts.sh
          ./scripts/test-app-accessibility-labels.sh

      - name: Run modern unit and integration tests
        env:
          IDLESCREEN_ENABLE_COVERAGE: ${{ github.event_name == 'push' && 'YES' || 'NO' }}
        run: ./scripts/test-modern-schemes.sh "$RUNNER_TEMP/idlescreen-test-results"

      - name: Run deterministic product fixtures
        env:
          IDLESCREEN_COVERAGE_RESULT_BUNDLE: ${{ github.event_name == 'push' && format('{0}/idlescreen-test-results/IdleScreenAppCompileGate.xcresult', runner.temp) || '' }}
        run: |
          python3 ./scripts/test_xccov_to_lcov.py
          ./scripts/test-coverage-floor.sh
          python3 ./scripts/test_performance_r1_report.py
          ./scripts/test-run-performance-r1.sh
          ./scripts/test-camera-gate-c8-soak-planner.py
          ./scripts/test-controlled-physical-soak.py
          ./scripts/test-companion-compile-gate.sh /tmp/idlescreen-ci-companion-gate
          ./scripts/test-idlescreenctl-runtime.sh
          ./scripts/test-camera-agent-product-fixtures.sh
          (umask 077; ./scripts/test-synthetic-gate-product-fixtures.sh)
          ./scripts/test-release-archive-provenance-fixtures.sh
          ./scripts/test-r1-release-candidate-fixtures.sh
          ./scripts/test-public-release-contract.sh
          ./scripts/test-camera-gate-c4-evidence-fixtures.py
          ./scripts/test-camera-gate-c5-evidence-fixtures.py
          ./scripts/test-camera-gate-evidence-common.py
          ./scripts/test-camera-gate-c6-offline-fixtures.py
          ./scripts/test-camera-gate-c8-offline-fixtures.py
          ./scripts/test-camera-agent-profile-policy.sh
          ./scripts/test-camera-gate-a1-config.sh
          ./scripts/test-camera-gate-a1-runner.sh
          ./scripts/test-companion-launch-policy.sh
          ./scripts/test-console-lock-state.sh
          ./scripts/test-host-lifecycle-log.sh
          ./scripts/test-host-lifecycle-matrix-evidence.sh
          ./scripts/test-host-lifecycle-matrix-guard.sh
          ./scripts/test-idle-activation-log.sh
          ./scripts/test-install-phase1-release-registration.sh
          ./scripts/test-live-configuration-delivery-guard.sh
          ./scripts/test-physical-state-transition.sh
          ./scripts/test-product-identity-verifier.sh
          ./scripts/test-record-host-lifecycle-matrix-cycle.sh
          ./scripts/test-selection-probe.sh
          ./scripts/test-shared-state-verifier.sh
          ./scripts/test-synthetic-gate-contracts.sh
          ./scripts/test-synthetic-gate-transaction.sh
          ./scripts/test-release-sbom-symlinks.sh
          ./scripts/test-notary-credential-fallback.sh

      - name: Convert test-run coverage to LCOV
        if: github.event_name == 'push'
        run: |
          results_root="$RUNNER_TEMP/idlescreen-test-results"
          coverage_root="$RUNNER_TEMP/idlescreen-coverage"
          mkdir -p "$coverage_root"
          for result_bundle in "$results_root"/*.xcresult; do
            scheme="$(basename "$result_bundle" .xcresult)"
            xcrun xccov view --archive --json "$result_bundle" \
              >"$coverage_root/$scheme.json"
          done
          [[ "$(find "$coverage_root" -name '*.json' | wc -l)" -eq 12 ]]
          python3 ./scripts/xccov_to_lcov.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$coverage_root/coverage.lcov" "$coverage_root"/*.json
          python3 ./scripts/check_coverage_floor.py --floor 80.0 \
            "$coverage_root/coverage.lcov"

      - name: Upload coverage report for the coverage job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: ${{ runner.temp }}/idlescreen-coverage/coverage.lcov
          if-no-files-found: error
          retention-days: 1

      - name: Build canonical companion product
        run: |
          xcodebuild build -quiet \
            -project IdleScreen.xcodeproj \
            -scheme IdleScreenApp \
            -destination 'platform=macOS' \
            -derivedDataPath /tmp/idlescreen-ci-product \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Set up Node.js for website and docs checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Website and docs build and browser checks (Chromium, Firefox, WebKit)
        run: ./scripts/verify-website-browsers.sh

  coverage:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage report from build-and-test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: ${{ runner.temp }}/idlescreen-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/idlescreen-coverage/coverage.lcov
          disable_search: true
          plugins: noop
          fail_ci_if_error: true

  qlty:
    name: qlty
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.segment.io:443
            api0.prismacloud.io:443
            cafe.github.com:443
            dl.google.com:443
            files.pythonhosted.org:443
            github-proxy.qlty.sh:443
            github.com:443
            go.dev:443
            nodejs.org:443
            proxy.golang.org:443
            pypi.org:443
            qlty-releases.s3.amazonaws.com:443
            radarlint-releases.s3.amazonaws.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Run Qlty gate
        run: ./scripts/qlty-check-gate.sh all
