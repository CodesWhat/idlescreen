name: "Security: CodeQL"

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Swift changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Swift-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          swift=false
          case "$EVENT_NAME" in
            schedule | workflow_dispatch)
              swift=true
              ;;
            pull_request)
              if files="$(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" | tr '\0' '\n')"; then
                :
              else
                swift=true
              fi
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                swift=true
              elif files="$(git diff --no-renames --name-only -z "$BEFORE_SHA..$HEAD_SHA" | tr '\0' '\n')"; then
                :
              else
                swift=true
              fi
              ;;
            *)
              swift=true
              ;;
          esac
          if [[ "$swift" != true ]] && grep -Eq \
            -e '\.(swift|metal)$' \
            -e '^(project\.yml|Package\.swift|Package\.resolved)$' \
            -e '(^|/)(Package\.swift|Package\.resolved)$' \
            -e '^(Sources|Products|Tests|IdleScreen\.xcodeproj)/' \
            -e '^\.github/workflows/security-codeql\.yml$' <<<"$files"; then
            swift=true
          fi
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "Swift analysis needed: $swift"

  analyze:
    name: Analyze (${{ matrix.language }})
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: c-cpp
            runner: ubuntu-latest
            build-mode: none
          - language: python
            runner: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ${{ needs.changes.outputs.swift == 'true' && 'macos-26' || 'ubuntu-24.04' }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        if: needs.changes.outputs.swift == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        if: needs.changes.outputs.swift == 'true'
        run: |
          arch -arm64 /opt/homebrew/bin/brew install xcodegen
          [[ "$(xcodegen --version)" == "Version: 2.46.0" ]]

      - name: Initialize CodeQL
        if: needs.changes.outputs.swift == 'true'
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: swift
          build-mode: manual

      - name: Generate Xcode project
        if: needs.changes.outputs.swift == 'true'
        run: |
          xcodegen generate
          git diff --exit-code -- IdleScreen.xcodeproj

      - name: Build Swift manually
        if: needs.changes.outputs.swift == 'true'
        run: |
          xcodebuild build -quiet \
            -project IdleScreen.xcodeproj \
            -scheme IdleScreenApp \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/idlescreen-codeql" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal'

      - name: Analyze
        if: needs.changes.outputs.swift == 'true'
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:swift"

      - name: Harden runner (reuse)
        if: needs.changes.outputs.swift != 'true' && github.event_name == 'pull_request'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443

      - name: Fetch base Swift analysis
        if: needs.changes.outputs.swift != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$REPO/code-scanning/analyses?ref=refs/heads/$BASE_REF&tool_name=CodeQL&per_page=100" \
            | jq -r '[.[] | select(.category == "/language:swift")] | sort_by(.created_at) | last | .id // empty')"
          if [[ -z "$id" ]]; then
            echo "::error::No Swift CodeQL analysis found on $BASE_REF. Run this workflow on $BASE_REF (workflow_dispatch) so a Swift baseline exists."
            exit 1
          fi
          echo "Reusing base Swift analysis $id from $BASE_REF"
          gh api -H 'Accept: application/sarif+json' "repos/$REPO/code-scanning/analyses/$id" > "$RUNNER_TEMP/swift-base-raw.sarif"
          # Drop automationDetails so the category input alone sets the analysis id.
          jq 'del(.runs[].automationDetails)' "$RUNNER_TEMP/swift-base-raw.sarif" > "$RUNNER_TEMP/swift-base.sarif"

      - name: Upload base Swift analysis
        if: needs.changes.outputs.swift != 'true' && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: ${{ runner.temp }}/swift-base.sarif
          category: "/language:swift"
